# ===================== FarmSaver recipe.yml =====================
# Costs for every enchantment tier. Tiers must be applied in order (I -> II -> III).
# applies-to: HOE, AXE, PICKAXE, SHOVEL, SWORD, MACE, SPEAR, BOW, CROSSBOW, FISHING_ROD,
#             HELMET, CHESTPLATE, LEGGINGS, BOOTS
# enabled: false (optional, per enchantment) removes it from the GUI and disables its effect.
# requirements: any Material name -> amount (iron, diamond, netherite, ...)
enchantments:
  farming_fortune:
    display-name: "&6Farming Fortune"
    description: "&7Chance for extra crop drops."
    applies-to: [HOE]
    tiers:
      '1':
        xp-levels: 5
        requirements: { IRON_INGOT: 8 }
      '2':
        xp-levels: 12
        requirements: { IRON_INGOT: 16, DIAMOND: 2 }
      '3':
        xp-levels: 25
        requirements: { DIAMOND: 8, IRON_BLOCK: 1 }

  foraging_fortune:
    display-name: "&2Foraging Fortune"
    description: "&7Extra log drops + auto-replant."
    applies-to: [AXE]
    tiers:
      '1':
        xp-levels: 5
        requirements: { IRON_INGOT: 8 }
      '2':
        xp-levels: 12
        requirements: { IRON_INGOT: 16, DIAMOND: 2 }
      '3':
        xp-levels: 25
        requirements: { DIAMOND: 8, IRON_BLOCK: 1 }

  treecapitator:
    display-name: "&cTreecapitator"
    description: "&7Fells the whole tree at once."
    applies-to: [AXE]
    tiers:
      '1':
        xp-levels: 20
        requirements: { DIAMOND: 12, IRON_BLOCK: 1 }

  trample_protection:
    display-name: "&bTrample Protection"
    description: "&7Never trample farmland again."
    applies-to: [BOOTS]
    tiers:
      '1':
        xp-levels: 8
        requirements: { IRON_INGOT: 10, DIAMOND: 1 }

  replenish:
    enabled: true
    display-name: "&aReplenish"
    # applies-to: [HOE] = crops only. AXE keeps the tree replanting added earlier.
    description: "&7Replants crops (hoe) and trees (axe) after harvesting."
    applies-to: [HOE, AXE]
    tiers:
      '1':
        xp-levels: 15
        requirements: { DIAMOND: 4, IRON_INGOT: 12 }

  auto_pickup:
    display-name: "&9Auto Pickup"
    description: "&7Harvested crops (hoe) and logs (axe) go straight to your inventory."
    applies-to: [HOE, AXE]
    tiers:
      '1':
        xp-levels: 15
        requirements: { IRON_INGOT: 16, HOPPER: 2 }

